<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SharePoint 構成方式の比較（方式A／B／C）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif; font-size:14px; color:#323130; background:#faf9f8; }
  button { font-family:inherit; }

  /* ===== M365 スイートバー ===== */
  .suite { background:#000; height:48px; display:flex; align-items:center; color:#fff; padding:0 0 0 0; }
  .waffle-btn { width:48px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .waffle-btn:hover { background:#333; }
  .waffle { display:grid; grid-template-columns:repeat(3,4px); grid-gap:4px; }
  .waffle i { width:4px; height:4px; background:#fff; display:block; }
  .suite .brand { font-size:16px; font-weight:600; padding:0 8px; letter-spacing:.2px; }
  .suite-search { flex:1; display:flex; justify-content:center; }
  .suite-search .box { width:min(560px,46vw); height:32px; background:#fff; border-radius:4px; display:flex; align-items:center; padding:0 8px; }
  .suite-search input { flex:1; border:none; outline:none; font-size:13px; color:#323130; background:transparent; }
  .suite-search .box span { color:#605e5c; font-size:13px; margin-right:6px; }
  .suite-icons { display:flex; align-items:center; }
  .suite-icons .ic { width:48px; height:48px; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color:#fff; }
  .suite-icons .ic:hover { background:#333; }
  .me { width:28px; height:28px; border-radius:50%; background:#e8590c; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; margin:0 10px; }

  /* ===== SharePoint アプリバー（左レール） ===== */
  .layout { display:flex; min-height:calc(100vh - 48px); }
  .appbar { width:48px; background:#f3f2f1; border-right:1px solid #edebe9; padding-top:8px; flex-shrink:0; }
  .appbar .ab { width:48px; height:44px; display:flex; align-items:center; justify-content:center; font-size:17px; color:#605e5c; cursor:pointer; position:relative; }
  .appbar .ab:hover { background:#e1dfdd; }
  .appbar .ab.on { color:#0078d4; }
  .appbar .ab.on::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:3px; background:#0078d4; border-radius:2px; }

  .content { flex:1; min-width:0; }

  /* ===== ハブナビ ===== */
  .hubnav { background:#fff; border-bottom:1px solid #edebe9; display:flex; align-items:center; padding:0 20px; height:44px; overflow-x:auto; }
  .hubnav .hubname { font-weight:600; font-size:13.5px; margin-right:18px; white-space:nowrap; color:#323130; display:flex; gap:8px; align-items:center; }
  .hubnav .hubname .tile { width:22px; height:22px; background:#0b3d91; color:#fff; font-size:10px; display:flex; align-items:center; justify-content:center; border-radius:2px; font-weight:700; }
  .hublink { padding:12px 10px; font-size:13px; color:#323130; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
  .hublink:hover { color:#0078d4; }
  .hublink.on { border-bottom-color:#0078d4; color:#0078d4; font-weight:600; }

  /* ===== サイトヘッダー ===== */
  .sitehead { background:#fff; padding:14px 24px 0; border-bottom:1px solid #edebe9; }
  .sh-row { display:flex; align-items:center; gap:14px; }
  .sitetile { width:56px; height:56px; border-radius:3px; color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .sh-title { font-size:20px; font-weight:700; color:#323130; }
  .sh-sub { font-size:12px; color:#605e5c; margin-top:2px; display:flex; gap:14px; align-items:center; }
  .followbtn { border:1px solid #8a8886; background:#fff; border-radius:2px; font-size:12px; padding:3px 10px; cursor:pointer; margin-left:auto; }
  .members { font-size:12px; color:#605e5c; }
  .sh-nav { display:flex; gap:2px; margin-top:10px; }
  .sh-nav div { padding:8px 12px; font-size:13px; color:#323130; border-bottom:2px solid transparent; cursor:pointer; }
  .sh-nav div.on { border-bottom-color:#0078d4; color:#0078d4; font-weight:600; }

  /* ===== 本体（クイック起動＋ライブラリ） ===== */
  .body2 { display:flex; }
  .quick { width:220px; background:#faf9f8; border-right:1px solid #edebe9; padding:12px 0; flex-shrink:0; min-height:60vh; }
  .quick .qi { padding:8px 20px; font-size:13.5px; color:#323130; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .quick .qi:hover { background:#f3f2f1; }
  .quick .qi.on { background:#edebe9; font-weight:600; }
  .quick .qi .f { font-size:10px; color:#a19f9d; min-width:34px; font-weight:600; }
  .quick hr { border:none; border-top:1px solid #edebe9; margin:8px 0; }
  .quick .qh { font-size:11px; color:#a19f9d; padding:2px 20px 6px; }

  .libarea { flex:1; min-width:0; padding:6px 26px 40px; background:#fff; }

  /* コマンドバー */
  .cmdbar { display:flex; align-items:center; height:44px; border-bottom:1px solid #edebe9; gap:2px; }
  .cmd { display:flex; align-items:center; gap:6px; font-size:13.5px; padding:7px 10px; border-radius:2px; cursor:pointer; color:#323130; }
  .cmd:hover { background:#f3f2f1; }
  .cmd .i { color:#0078d4; font-size:14px; }
  .cmd.primary { color:#0078d4; font-weight:600; }
  .cmd .caret { font-size:9px; color:#605e5c; }
  .cmd-r { margin-left:auto; display:flex; align-items:center; gap:2px; }

  /* パンくず・タイトル */
  .libtitle { font-size:17px; font-weight:700; padding:16px 0 6px; color:#323130; }

  /* テーブル（ドキュメント ライブラリ） */
  .doclist { width:100%; border-collapse:collapse; }
  .doclist th { text-align:left; font-size:12px; font-weight:600; color:#605e5c; padding:8px 10px; border-bottom:1px solid #edebe9; white-space:nowrap; cursor:pointer; user-select:none; position:relative; }
  .doclist th:hover { background:#f3f2f1; color:#323130; }
  .doclist th .caret { font-size:9px; margin-left:4px; color:#a19f9d; }
  .doclist td { padding:10px 10px; border-bottom:1px solid #f3f2f1; font-size:13.5px; white-space:nowrap; }
  .doclist tr.row:hover td { background:#f3f2f1; }
  .doclist .sel { width:34px; text-align:center; color:#a19f9d; }
  .doclist tr.row:hover .sel::before { content:"◯"; font-size:12px; }
  .fname { color:#323130; cursor:pointer; display:flex; align-items:center; gap:9px; }
  .fname:hover { color:#0078d4; text-decoration:underline; }
  .ficon { width:20px; height:20px; border-radius:2px; color:#fff; font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .fx { background:#217346; } .fw { background:#2b579a; } .fp { background:#d24726; } .fpdf { background:#b30b00; } .fmp4 { background:#5c2d91; } .fzip { background:#797775; }
  .pill { font-size:11px; padding:1px 8px; border-radius:9px; font-weight:600; }
  .pl-L1{background:#edf2fa;color:#2f5597}.pl-L2{background:#e9f4eb;color:#217a3c}.pl-L3{background:#fff8e1;color:#8a6d00}
  .pl-L4{background:#fdefe3;color:#c55a11}.pl-L5{background:#fce4e4;color:#c00000}.pl-X{background:#f3f2f1;color:#797775}
  .muted { color:#605e5c; }

  /* 列フィルタ ドロップダウン */
  .colmenu { position:absolute; top:100%; left:0; background:#fff; border:1px solid #d2d0ce; box-shadow:0 6px 15px rgba(0,0,0,.13); z-index:30; min-width:190px; padding:6px 0; font-weight:400; }
  .colmenu .cm { padding:7px 14px; font-size:13px; display:flex; gap:8px; align-items:center; color:#323130; }
  .colmenu .cm:hover { background:#f3f2f1; }
  .colmenu .sep { border-top:1px solid #edebe9; margin:5px 0; }

  /* 詳細ペイン */
  .infopane { width:320px; border-left:1px solid #edebe9; background:#fff; padding:18px; flex-shrink:0; display:none; }
  .infopane.on { display:block; }
  .infopane h3 { font-size:15px; margin-bottom:12px; }
  .ip-row { font-size:12.5px; margin-bottom:10px; }
  .ip-row .k { color:#605e5c; font-size:11.5px; }
  .ip-row .v { margin-top:2px; }

  /* アクセス拒否（SPO風） */
  .denied { padding:70px 30px; text-align:center; }
  .denied .lk { font-size:44px; }
  .denied h2 { font-size:18px; margin:12px 0 8px; color:#323130; }
  .denied p { font-size:13px; color:#605e5c; line-height:1.8; }
  .denied .req { margin-top:16px; background:#0078d4; color:#fff; border:none; padding:8px 18px; border-radius:2px; font-size:13px; cursor:pointer; }

  .footnote { font-size:11.5px; color:#a19f9d; padding:14px 2px; }

  /* ===== 解説オーバーレイ（?guide=1 または G キーで表示。既定は非表示） ===== */
  body.guide { padding-bottom:142px; }
  .g-badge { position:fixed; width:23px; height:23px; border-radius:50%; background:#d83b01;
             color:#fff; font-size:12.5px; font-weight:700; line-height:23px; text-align:center;
             z-index:9000; box-shadow:0 1px 4px rgba(0,0,0,.45); pointer-events:none;
             font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif; }
  .g-hl { outline:2px dashed #d83b01 !important; outline-offset:2px; }
  .g-legend { position:fixed; left:0; right:0; bottom:0; z-index:9001; background:#fff;
              border-top:2px solid #d83b01; box-shadow:0 -3px 14px rgba(0,0,0,.16); padding:11px 18px 13px; }
  .g-legend .g-hd { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .g-legend .g-hd b { font-size:12.5px; color:#d83b01; letter-spacing:.02em; }
  .g-legend .g-hd span { font-size:11px; color:#605e5c; }
  .g-legend .g-x { margin-left:auto; font-size:11px; color:#605e5c; border:1px solid #d2d0ce;
                   border-radius:2px; padding:2px 9px; cursor:pointer; background:#faf9f8; }
  .g-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px 22px; }
  .g-it { display:flex; gap:7px; align-items:flex-start; }
  .g-it i { flex:none; width:18px; height:18px; border-radius:50%; background:#d83b01; color:#fff;
            font-size:10.5px; font-weight:700; line-height:18px; text-align:center; font-style:normal; margin-top:1px; }
  .g-it div { min-width:0; }
  .g-it b { display:block; font-size:11.5px; color:#201f1e; line-height:1.45; }
  .g-it p { margin:0; font-size:10.5px; color:#605e5c; line-height:1.5; }

/* ===== 方式切替バー ===== */
.planbar{display:flex;align-items:stretch;gap:0;background:#fff;border-bottom:1px solid #e1dfdd;
  padding:0 20px;min-height:52px}
.planbar .pb-lab{display:flex;align-items:center;font-size:12px;color:#605e5c;font-weight:600;
  padding-right:16px;white-space:nowrap}
.planbar .pb{display:flex;flex-direction:column;justify-content:center;padding:8px 18px;cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap}
.planbar .pb:hover{background:#f3f2f1}
.planbar .pb.on{border-bottom-color:#0078d4;background:#f3f9fd}
.planbar .pb b{font-size:13px;color:#323130;font-weight:600}
.planbar .pb.on b{color:#0078d4}
.planbar .pb em{font-size:11px;color:#797775;font-style:normal;margin-top:2px}
.planbar .pb-link{display:flex;align-items:center;margin-left:auto;font-size:12px;color:#0078d4;
  text-decoration:none;white-space:nowrap;padding:0 14px;font-weight:600}
.planbar .pb-link:hover{text-decoration:underline}
.planbar .pb-note{display:flex;align-items:center;font-size:11.5px;color:#605e5c;
  padding-left:12px;text-align:right;line-height:1.45;max-width:34%}
@media (max-width:1180px){ .planbar .pb-note{display:none} }
@media (max-width:900px){ .planbar .pb em{display:none} .planbar{min-height:44px} }
</style>
</head>
<body>

<!-- M365 スイートバー -->
<div class="suite">
  <div class="waffle-btn"><div class="waffle"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="brand">SharePoint</div>
  <div class="suite-search"><div class="box"><span>🔍</span><input id="q" placeholder="このライブラリを検索" oninput="render()"></div></div>
  <div class="suite-icons">
    <div class="ic">⚙</div><div class="ic">？</div><div class="ic">🔔</div>
    <div class="me" id="avatar" onclick="cyclePersona()" style="cursor:pointer" title="アカウント">社</div>

</div>

<div class="layout">
  <!-- SharePoint アプリバー -->
  <div class="appbar">
    <div class="ab on" title="ホーム">🏠</div>

    <div class="ab" title="マイ ファイル">📄</div>

  <div class="content">

    <div class="planbar" id="planbar"></div>
    <!-- ハブナビ -->
    <div class="hubnav" id="hubnav"></div>
    <!-- サイトヘッダー -->
    <div class="sitehead" id="sitehead"></div>
    <!-- 本体 -->
    <div class="body2">
      <div class="quick" id="quick"></div>
      <div class="libarea" id="libarea"></div>
      <div class="infopane" id="infopane"></div>
    </div>
  </div>
</div>

<script>

if(!PERSONA[curPersona]) curPersona = "ALL";

/* 見える／見えない（本番＝権限のないものはリンクごと非表示）
   7/30 御社ご指摘の反映：L3の判定を「部署が一致するか」から
   「そのライブラリの公開範囲に自部署が含まれるか」へ変更（コンテンツ単位） */
function canSee(l){
  const s = SITES.find(x=>x.id===l.site), p = me();
  if (p.exec) return true;
  if (s.l5 || l.lv==="L5") return false;          // L5：対象者以外は存在も見えない（J-30/J-35）
  if (s.open || s.hub) return true;
  if (l.lv==="L2") return true;
  if (p.cross && l.lv==="L3") return true;      /* 8/7: 情シスはL3を部署横断で閲覧 */                   // L2＝全社閲覧
  const sc = shareOf(l);
  const inScope = sc.includes("（全社）") || sc.includes(p.dept) || (s.kobai && p.kobai);
  if (l.lv==="L3") return inScope;                // L3＝公開範囲に含まれる部署
  if (l.lv==="L4") return inScope && p.mgr;       // L4＝そのうえで管理職のみ
  return false;
}
/* 更新できるか（投稿）／閲覧のみ
   公開範囲の先頭＝主管部署。主管部署は更新可、その他の部署は閲覧のみ */
const ownerOf = l => shareOf(l)[0];
function canEdit(l){
  const s = SITES.find(x=>x.id===l.site), p = me();
  if (s.ro) return false;
  if (s.open) return true;
  if (l.lv==="L5") return p.exec;
  if (l.lv==="L2") return s.dept===p.dept;
  const owner = ownerOf(l)===p.dept || (s.kobai && p.kobai);
  return owner && (l.lv!=="L4" || p.mgr);
}

function drawGuideInner(){

    const p = { tl:[r.left-11, r.top-11],
                r :[r.right+7, r.top+r.height/2-11.5],
                l :[r.left-30, r.top+r.height/2-11.5] }[g.at];
    const b = document.createElement("div");
    b.className = "g-badge"; b.textContent = g.n;
    b.style.left = Math.max(2, p[0]) + "px";
    b.style.top  = Math.max(2, p[1]) + "px";
    document.body.appendChild(b);
  });
}

document.addEventListener("keydown", e=>{
  if((e.key==="g"||e.key==="G") && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) toggleGuide();
});
addEventListener("resize", drawGuide);
addEventListener("scroll", drawGuide, true);

onPersona();
</script>
